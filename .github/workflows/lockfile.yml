# package-lock.json 자동 생성 워크플로
# - package.json이 바뀌어 push되면 자동 실행 (Actions 탭에서 수동 실행도 가능)
# - GitHub 서버에서 npm install을 돌려 lock 파일을 만들고 저장소에 커밋합니다.
name: Generate package-lock.json

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: lock 파일 생성
        run: npm install --package-lock-only --ignore-scripts

      - name: 설치 & 엔진 테스트로 검증
        run: |
          npm ci
          npm test

      - name: 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: package-lock.json 생성"
            git push
          fi
